<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will you be my Valentine?</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background"></div>

    <main class="layout">
      <section class="card shadow-lg border-0 rounded-5">
        <h1 id="headline" class="headline">Hey there 💘</h1>
        <p id="subtext" class="subtext">Will you be my Valentine?</p>

        <div class="button-group">
          <button type="button" class="btn btn-sm valentine-btn yes-btn" id="yesBtn">
            Yes
          </button>
          <button
            type="button"
            class="btn btn-sm valentine-btn no-btn"
            id="noBtn"
            aria-label="Politely decline"
          >
            No
          </button>
        </div>

        <p id="statusMessage" class="status-message" aria-live="polite"></p>
      </section>

      <div id="confetti-container"></div>
    </main>

    <footer class="footer">
      <p>Tip: try to click 'No' 😉</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
